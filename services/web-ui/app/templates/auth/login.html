<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Restaurant Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #111827; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 420px; }
    .brand { font-size: 1.5rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 2rem; }
    .brand span { color: #f59e0b; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <i class="bi bi-cup-hot-fill me-2"></i>Restaurant<span>Manager</span>
  </div>

  <div class="card border-0 shadow-lg">
    <div class="card-body p-4">
      <h5 class="card-title fw-semibold mb-4">Вход в систему</h5>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>{{ msg }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-medium">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="admin@restaurant.local"
                   required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-medium">Пароль</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" required minlength="1">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Войти
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
